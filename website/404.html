<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Free Domains</title>
    <meta name="description" content="The page you're looking for couldn't be found. Return to Free Domains to explore our collection of free subdomains.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#3b82f6">
    <base href="/">
    <script>
        // A missing page keeps its requested URL, including any nested path.
        const projectHost = location.hostname.endsWith('.github.io') ||
            ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
        if (projectHost && /^\/free-domains(?:\/|$)/.test(location.pathname)) {
            document.querySelector('base').href = '/free-domains/';
        }
    </script>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="assets/site.css">
    <script src="assets/site.js" defer></script>
</head>
<body>
    <header class="site-header" data-site-header></header>
    <main class="error-main">
        <div class="container error-layout">
            <section class="error-intro" aria-labelledby="error-title">
                <p class="error-status"><span data-icon="signpost" aria-hidden="true"></span>404</p>
                <h1 class="error-title" id="error-title">Page Not Found</h1>
                <p class="error-subtitle">Oops! The page you're looking for seems to have disappeared into the digital void. Don't worry, even the best domains sometimes lead to dead ends.</p>
                <div class="error-actions">
                    <a href="./" class="btn btn-primary">Home <span data-icon="arrow" aria-hidden="true"></span></a>
                    <a href="./" class="btn btn-secondary" data-go-back><span data-icon="back" aria-hidden="true"></span> Go Back</a>
                </div>
            </section>
            <section class="error-panel" aria-labelledby="destinations">
                <h2 id="destinations">Popular Destinations</h2>
                <ul class="links-grid">
                    <li><a href="./#domains" class="link-item">Explore Domains <span data-icon="arrow" aria-hidden="true"></span></a></li>
                    <li><a href="https://github.com/harys722/free-domains" target="_blank" rel="noopener noreferrer" class="link-item">GitHub Repository <span data-icon="arrow-up-right" aria-hidden="true"></span></a></li>
                    <li><a href="https://is-a.dev" target="_blank" rel="noopener noreferrer" class="link-item">is-a.dev <span data-icon="arrow-up-right" aria-hidden="true"></span></a></li>
                    <li><a href="https://js.org" target="_blank" rel="noopener noreferrer" class="link-item">js.org <span data-icon="arrow-up-right" aria-hidden="true"></span></a></li>
                </ul>
            </section>
        </div>
    </main>
    <footer class="site-footer" data-site-footer></footer>
</body>
</html>
